name: Update weather from tenki.jp

on:
  schedule:
    - cron: "15 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecasts
        run: python scripts/fetch_weather.py
      - name: Commit if changed
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add weather.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "weather: update from tenki.jp"
            git push
          fi
